name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: proxy-skitchen-linux
          - os: windows-latest
            artifact: proxy-skitchen-windows
          - os: macos-latest
            artifact: proxy-skitchen-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-cursor0

      - name: Install Python dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build binaries
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          pyinstaller proxy-skitchen.spec --noconfirm
          pyinstaller proxy-skitchen-cli.spec --noconfirm
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv proxy-skitchen.exe proxy-skitchen-windows.exe
            mv proxy-skitchen-cli.exe proxy-skitchen-cli-windows.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then
            mv proxy-skitchen proxy-skitchen-macos
            mv proxy-skitchen-cli proxy-skitchen-cli-macos
          else
            mv proxy-skitchen proxy-skitchen-linux
            mv proxy-skitchen-cli proxy-skitchen-cli-linux
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
